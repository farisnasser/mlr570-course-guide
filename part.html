<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MLR 570 Course Guide</title>
<meta name="description" content="MLR570 course notes, part by part, with interactive visuals.">
<meta name="theme-color" content="#0b0e1a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0e1a'/%3E%3Cpath d='M7 23 L14 9 L25 13' stroke='%235fe0b0' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Cpath d='M7 23 L22 21' stroke='%23ff7a59' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link rel="stylesheet" href="src/theme.css">
<link rel="stylesheet" href="src/site.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script type="module" src="src/app.js"></script>
</head>
<body>
<header class="top">
  <div class="top-in">
    <button id="rail-btn" class="rail-btn" type="button" aria-label="Open the course contents">Contents</button>
    <a class="brand" href="index.html"><span>MLR 570</span><b>Course Guide</b></a>
    <span id="crumb" class="crumb"></span>
    <span class="top-prog"><span class="bar"><i id="top-bar"></i></span><span id="top-pct"></span></span>
  </div>
  <i id="read-prog" class="read-prog"></i>
</header>
<div class="layout">
  <nav id="rail" class="rail" aria-label="Course contents"></nav>
  <main class="read">
    <div id="head"></div>
    <article id="notes" class="nt"><p style="color:var(--muted)">Loading the notes…</p></article>
    <div id="done" class="donebox" hidden><span>Finished reading this part?</span><button id="done-btn" class="btn pri" type="button">Mark part complete</button></div>
    <nav id="pnav" class="pnav" aria-label="Previous and next part"></nav>
  </main>
</div>
<div id="scrim" class="scrim" hidden></div>
</body>
</html>
